MEMORY {
    ZEROPAGE: start = $0000, size = $0100, type = rw;
    RAM:      start = $0300, size = $0500, type = rw;

    HEADER:   file = %O, start = $0000, size = $0010,  fill = yes;
    ROM0:     file = %O, start = $8000, size = $3FFA,  fill = yes;
    VECTORS:  file = %O, start = $FFFA, size = $0006,  fill = yes;

    ROM1:     file = %O, start = $C000, size = $4000,  fill = yes;
    ROM2:     file = %O, start = $C000, size = $4000,  fill = yes;
    ROM3:     file = %O, start = $C000, size = $4000,  fill = yes;
    ROM4:     file = %O, start = $C000, size = $4000,  fill = yes;
    ROM5:     file = %O, start = $C000, size = $4000,  fill = yes;
    ROM6:     file = %O, start = $C000, size = $4000,  fill = yes;
    ROM7:     file = %O, start = $C000, size = $4000,  fill = yes;
}

SEGMENTS {
    HEADER:   load = HEADER,   type = ro;
    ZEROPAGE: load = ZEROPAGE, type = zp;
    CODE:     load = ROM0,     type = ro;
    RODATA:   load = ROM0,     type = ro;
    VECTORS:  load = VECTORS,  type = ro;

    BANK1:    load = ROM1,     type = ro;
    BANK2:    load = ROM2,     type = ro;
    BANK3:    load = ROM3,     type = ro;
    BANK4:    load = ROM4,     type = ro;
    BANK5:    load = ROM5,     type = ro;
    BANK6:    load = ROM6,     type = ro;
    BANK7:    load = ROM7,     type = ro;
}
